services:
  app:
    build:
      context: ./apps/back
      dockerfile: docker/php/Dockerfile
    container_name: ecommerce-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./apps/back:/var/www
    networks:
      - ecommerce

  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./apps/back:/var/www
      - ./apps/back/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ecommerce

  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce

  ollama:
    image: ollama/ollama:latest
    container_name: ecommerce-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ecommerce

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ecommerce-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ecommerce

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecommerce-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - ecommerce

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: ecommerce-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/client:/workspace/apps/client
      - ./packages:/workspace/packages
      - client_node_modules:/workspace/node_modules
      - client_next:/workspace/apps/client/.next
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      API_INTERNAL_URL: "http://nginx"
    networks:
      - ecommerce

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    container_name: ecommerce-cms
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/cms:/workspace/apps/cms
      - ./packages:/workspace/packages
      - cms_node_modules:/workspace/apps/cms/node_modules
    networks:
      - ecommerce

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: ecommerce-admin
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./apps/admin:/workspace/apps/admin
      - ./packages:/workspace/packages
      - admin_node_modules:/workspace/node_modules
      - admin_next:/workspace/apps/admin/.next
    environment:
      WATCHPACK_POLLING: "true"
    networks:
      - ecommerce

networks:
  ecommerce:

volumes:
  mysql_data:
  ollama_data:
  qdrant_data:
  client_node_modules:
  client_next:
  cms_node_modules:
  admin_node_modules:
  admin_next:
