services:
  # =========================
  # Laravel
  # PHP-FPM + Nginx
  # =========================
  app:
    build:
      context: ./apps/back
      dockerfile: docker/production/Dockerfile
    container_name: ecommerce-app
    restart: unless-stopped
    env_file:
      - ./apps/back/.env
    volumes:
      - laravel_storage:/var/www/storage/app/public
    networks:
      - ecommerce

  # =========================
  # MySQL
  # =========================
  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce

  # =========================
  # Next.js
  # =========================
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: http://192.236.219.134
        NEXT_PUBLIC_URL: http://192.236.219.134
    container_name: ecommerce-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://app
    depends_on:
      - app
    networks:
      - ecommerce

  # =========================
  # Public Nginx
  # =========================
  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - client
    networks:
      - ecommerce

networks:
  ecommerce:

volumes:
  mysql_data:
  laravel_storage:
